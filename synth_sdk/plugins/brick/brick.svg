<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 width="320px" height="160px" viewBox="0 0 320 160">
<!-- brick: six face groups in local 2D coordinates. brick.c projects them into an orthographic
     3D view and turns the box with the blue knob. -->
<!-- ground shadow: the brick's footprint, projected by brick.c and nudged down the screen -->
<g id="shadow">
<rect x="0" y="0" width="168" height="48" fill="#1C1310"/>
</g>

<!-- front: local 168 x 68, origin top-left as seen from the front -->
<g id="front">
<rect x="0" y="0" width="168" height="68" fill="#A3452E" stroke="#E7B7A6" stroke-width="1"/>
<line fill="none" stroke="#D97757" stroke-width="1" x1="4" y1="4" x2="164" y2="4"/>
<rect x="20" y="14" width="128" height="40" fill="none" stroke="#8E3826" stroke-width="1"/>
<line fill="none" stroke="#C05A40" stroke-width="1" x1="22" y1="52" x2="146" y2="52"/>
<path fill="none" stroke="#6E2517" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="M86,8 L92,22 L88,34 L98,48"/>
<circle fill="#7A2A1B" cx="36" cy="26" r="1.2"/>
<circle fill="#7A2A1B" cx="46" cy="42" r="0.9"/>
<circle fill="#7A2A1B" cx="124" cy="24" r="1.1"/>
<circle fill="#7A2A1B" cx="134" cy="46" r="1.3"/>
<circle fill="#7A2A1B" cx="72" cy="60" r="0.8"/>
<circle fill="#7A2A1B" cx="112" cy="20" r="0.8"/>
</g>

<!-- back: local 168 x 68, origin top-left as seen from behind -->
<g id="back">
<rect x="0" y="0" width="168" height="68" fill="#933D28" stroke="#E7B7A6" stroke-width="1"/>
<line fill="none" stroke="#C05A40" stroke-width="1" x1="4" y1="4" x2="164" y2="4"/>
<line fill="none" stroke="#7E2C1D" stroke-width="1" x1="20" y1="34" x2="148" y2="34"/>
<circle fill="#7A2A1B" cx="44" cy="46" r="1.1"/>
<circle fill="#7A2A1B" cx="120" cy="22" r="0.9"/>
<circle fill="#7A2A1B" cx="136" cy="52" r="1.2"/>
</g>

<!-- right: local 48 x 68, origin top-left as seen from the right -->
<g id="right">
<rect x="0" y="0" width="48" height="68" fill="#7A3324" stroke="#E7B7A6" stroke-width="1"/>
<line fill="none" stroke="#C05A40" stroke-width="1" x1="4" y1="4" x2="4" y2="64"/>
<circle fill="#6A2A1C" cx="26" cy="24" r="1.1"/>
<circle fill="#6A2A1C" cx="34" cy="46" r="0.9"/>
<circle fill="#6A2A1C" cx="18" cy="56" r="1.0"/>
</g>

<!-- left: local 48 x 68, origin top-left as seen from the left -->
<g id="left">
<rect x="0" y="0" width="48" height="68" fill="#8E3B27" stroke="#E7B7A6" stroke-width="1"/>
<line fill="none" stroke="#D97757" stroke-width="1" x1="4" y1="4" x2="4" y2="64"/>
<circle fill="#7A2A1B" cx="26" cy="28" r="1.0"/>
<circle fill="#7A2A1B" cx="36" cy="48" r="1.2"/>
<circle fill="#7A2A1B" cx="16" cy="60" r="0.8"/>
</g>

<!-- top: local 168 x 48, origin top-left as seen from above (back edge first) -->
<g id="top">
<rect x="0" y="0" width="168" height="48" fill="#C4664A" stroke="#E7B7A6" stroke-width="1"/>
<line fill="none" stroke="#D98B6F" stroke-width="1" x1="4" y1="4" x2="164" y2="4"/>
<circle fill="#170D0A" stroke="#D9A08E" stroke-width="1" cx="42" cy="24" r="10"/>
<circle fill="#170D0A" stroke="#D9A08E" stroke-width="1" cx="84" cy="24" r="10"/>
<circle fill="#170D0A" stroke="#D9A08E" stroke-width="1" cx="126" cy="24" r="10"/>
<circle fill="#7A2A1B" cx="20" cy="38" r="0.9"/>
<circle fill="#7A2A1B" cx="150" cy="12" r="0.8"/>
</g>

<!-- bottom: local 168 x 48, hidden in the fixed view but kept for completeness -->
<g id="bottom">
<rect x="0" y="0" width="168" height="48" fill="#5E281C" stroke="#E7B7A6" stroke-width="1"/>
<line fill="none" stroke="#4A1E15" stroke-width="1" x1="4" y1="4" x2="164" y2="4"/>
<circle fill="#3E1810" cx="50" cy="24" r="1.2"/>
<circle fill="#3E1810" cx="118" cy="30" r="1.0"/>
</g>
</svg>
